server {
    listen 80;
    server_name _;

    # 上传体积上限：必须与后端 MAWORK_GUARD_MAX_BODY（docker-compose.yml，现 50MB）保持一致。
    # 这里写在源文件里，Dockerfile 构建时拷进镜像，容器重建不会丢失。
    client_max_body_size 50m;

    root /usr/share/nginx/html;
    index index.html;

    # 应用外壳不缓存：发版后用户立即拿到新 index.html，避免引用已被删除的旧 hashed 资源导致白屏。
    # 用 no-store + Pragma/Expires 组合以尽量对抗微信 / iOS WKWebView 的激进缓存。
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }
    # manifest 也不缓存，保证 PWA 安装信息为最新
    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
        default_type application/manifest+json;
    }

    # SPA 路由回退（Vue Router history 模式需要）
    # 注意：访问 /daily、/home 这类路由时命中的是 location /，
    # 上面 location = /index.html 的 add_header 不会继承过来，
    # 必须在此重复声明，否则路由页会被缓存住（微信 / iOS 上表现为「发版不生效」）。
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # 后端 API 反代：前端同源调用 /api，由 nginx 转发到 backend 服务
    location /api/ {
        proxy_pass http://backend:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 透传 Authorization 头（鉴权必需）
        proxy_set_header Authorization $http_authorization;
    }

    # 静态资源长缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
